<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>工作流设计器</title>
    <base href="/elsa-studio/"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="_content/CodeBeam.MudBlazor.Extensions/MudExtensions.min.css" rel="stylesheet" />
    <link href="_content/Radzen.Blazor/css/material-base.css" rel="stylesheet" >
    <link href="_content/Elsa.Studio.Shell/css/shell.css" rel="stylesheet">
    <link href="Elsa.Studio.Host.CustomElements.styles.css" rel="stylesheet">
    <style>
        html, body { height: 100%; margin: 0; }
    </style>
</head>

<body>
<!-- 工作流定义编辑器：后端 API 地址由 appsettings.json 的 Backend:Url 配置（指向 /elsa/api）。 -->
<elsa-studio-workflow-definition-editor id="workflow-editor"></elsa-studio-workflow-definition-editor>

<div id="blazor-error-ui">
    An unhandled error has occurred.
    <a href="" class="reload">Reload</a>
    <a class="dismiss">🗙</a>
</div>
<script src="_content/BlazorMonaco/jsInterop.js"></script>
<script src="_content/BlazorMonaco/lib/monaco-editor/min/vs/loader.js"></script>
<script src="_content/BlazorMonaco/lib/monaco-editor/min/vs/editor/editor.main.js"></script>
<script src="_content/MudBlazor/MudBlazor.min.js"></script>
<script src="_content/CodeBeam.MudBlazor.Extensions/MudExtensions.min.js"></script>
<script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>
<script src="_framework/blazor.webassembly.js"></script>
<script>
    // 从查询参数读取 definition-id，注入到编辑器元素（在 Blazor 启动前设置好属性）。
    (function () {
        var params = new URLSearchParams(window.location.search);
        var defId = params.get('definitionId') || params.get('definition-id');
        var editor = document.getElementById('workflow-editor');
        if (editor && defId) {
            editor.setAttribute('definition-id', defId);
        }
    })();
</script>
</body>

</html>
